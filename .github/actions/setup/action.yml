name: 'Terraform Setup'
description: 'Sets up Terraform and configures AWS credentials'

inputs:
  environment:
    description: 'Environment to setup (test/prod)'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
  aws-role-arn:
    description: 'AWS IAM role ARN to assume'
    required: true
  s3-state-bucket:
    description: 'S3 bucket for Terraform state'
    required: true
  s3-state-key:
    description: 'S3 key for Terraform state'
    required: true
  terraform-version:
    description: 'Terraform version to use'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-Terraform-${{ inputs.environment }}
        mask-aws-account-id: true

    - name: Mask AWS account ID
      shell: bash
      run: echo "::add-mask::${{ steps.aws-credentials.outputs.aws-account-id }}"

    - name: Terraform Init
      id: init
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      run: |
        terraform init \
          -backend-config="bucket=${{ inputs.s3-state-bucket }}" \
          -backend-config="key=${{ inputs.s3-state-key }}" \
          -backend-config="region=${{ inputs.aws-region }}"
