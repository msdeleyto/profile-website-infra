name: 'Terraform Validate'
description: 'Validates Terraform configuration for a specific environment'

inputs:
  environment:
    description: 'Environment to validate (test/prod)'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
  aws-role-arn:
    description: 'AWS IAM role ARN to assume'
    required: true
  s3-state-bucket:
    description: 'S3 bucket for Terraform state'
    required: true
  s3-state-key:
    description: 'S3 key for Terraform state'
    required: true
  terraform-version:
    description: 'Terraform version to use'
    required: true

outputs:
  fmt-outcome:
    description: 'Outcome of terraform fmt check'
    value: ${{ steps.fmt.outcome }}
  validate-outcome:
    description: 'Outcome of terraform validate'
    value: ${{ steps.validate.outcome }}
  plan-outcome:
    description: 'Outcome of terraform plan'
    value: ${{ steps.plan.outcome }}
  tflint-outcome:
    description: 'Outcome of TFLint'
    value: ${{ steps.tflint.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Terraform Format Check
      id: fmt
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Setup Terraform and AWS
      uses: ./.github/actions/setup
      with:
        environment: ${{ inputs.environment }}
        aws-region: ${{ inputs.aws-region }}
        aws-role-arn: ${{ inputs.aws-role-arn }}
        s3-state-bucket: ${{ inputs.s3-state-bucket }}
        s3-state-key: ${{ inputs.s3-state-key }}
        terraform-version: ${{ inputs.terraform-version }}

    - name: Terraform Validate
      id: validate
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      run: terraform validate -no-color

    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      run: terraform plan -out=tfplan -no-color
      continue-on-error: true

    - name: TFLint Setup
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: TFLint Init
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      run: tflint --init

    - name: TFLint Run
      id: tflint
      shell: bash
      working-directory: envs/${{ inputs.environment }}
      run: tflint --recursive --format compact
      continue-on-error: true

    - name: Validation Summary
      shell: bash
      if: always()
      run: |
        echo "## Terraform Validation Results (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Format | ${{ steps.fmt.outcome }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Validate | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Plan | ${{ steps.plan.outcome }} |" >> $GITHUB_STEP_SUMMARY
        echo "| TFLint | ${{ steps.tflint.outcome }} |" >> $GITHUB_STEP_SUMMARY

    - name: Check for failures
      shell: bash
      if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.tflint.outcome == 'failure'
      run: exit 1
