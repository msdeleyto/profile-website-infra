name: Validate Terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Validate static code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Format Check
      id: fmt
      shell: bash
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: TFLint Setup
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: TFLint Init
      shell: bash
      run: tflint --init

    - name: TFLint Run
      id: tflint
      shell: bash
      run: tflint --recursive --format compact
      continue-on-error: true

    outputs:
      fmt-outcome: ${{ steps.fmt.outcome }}
      tflint-outcome: ${{ steps.tflint.outcome }}

  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        environment: [test, prod]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Terraform
      id: validate
      uses: ./.github/actions/validate
      with:
        environment: ${{ matrix.environment }}
        aws-region: ${{ secrets.AWS_REGION }}
        aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
        s3-state-bucket: ${{ secrets.S3_STATE_BUCKET }}
        s3-state-key: ${{ secrets.S3_STATE_KEY }}
        terraform-version: "~> 1.5"

    outputs:
      test-results: ${{ matrix.environment == 'test' && steps.validate.outputs.results || '' }}
      prod-results: ${{ matrix.environment == 'prod' && steps.validate.outputs.results || '' }}

  comment:
    name: Comment PR
    runs-on: ubuntu-latest
    needs: [lint, validate]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment PR with Results
        uses: actions/github-script@v7
        with:
          script: |
            // Find and delete previous bot comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComments = comments.filter(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Terraform Validation Results')
            );

            for (const comment of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            // Helper function to convert outcome to icon
            const getIcon = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              return '⚠️';
            };

            // Parse results
            const testResults = JSON.parse('${{ needs.validate.outputs.test-results }}' || '{}');
            const prodResults = JSON.parse('${{ needs.validate.outputs.prod-results }}' || '{}');

            // Post new comment with combined results
            const output = `## Terraform Validation Results

            ### Static Checks
            | Check | Status |
            |-------|--------|
            | Format | ${getIcon('${{ needs.lint.outputs.fmt-outcome }}')} |
            | TFLint | ${getIcon('${{ needs.lint.outputs.tflint-outcome }}')} |

            ### Environment Validation
            | Check | Test | Prod |
            |-------|------|------|
            | Validate | ${getIcon(testResults.validate)} | ${getIcon(prodResults.validate)} |
            | Plan | ${getIcon(testResults.plan)} | ${getIcon(prodResults.plan)} |`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
