name: Validate Terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Terraform
        id: validate
        uses: ./.github/actions/validate
        with:
          environment: prod
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          s3-state-bucket: ${{ secrets.S3_STATE_BUCKET }}
          s3-state-key: ${{ secrets.S3_STATE_KEY }}
          terraform-version: "~> 1.5"

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Find and delete previous bot comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComments = comments.filter(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Terraform Validation Results')
            );

            for (const comment of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            // Helper function to convert outcome to icon
            const getIcon = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              return '⚠️';
            };

            // Post new comment with table
            const output = `## Terraform Validation Results (prod)

            | Check | Status |
            |-------|--------|
            | Format   | ${getIcon('${{ steps.validate.outputs.fmt-outcome }}')} |
            | Validate | ${getIcon('${{ steps.validate.outputs.validate-outcome }}')} |
            | Plan     | ${getIcon('${{ steps.validate.outputs.plan-outcome }}')} |
            | TFLint   | ${getIcon('${{ steps.validate.outputs.tflint-outcome }}')} |

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if validation failed
        if: failure()
        run: exit 1
